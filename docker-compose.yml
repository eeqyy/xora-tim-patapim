services:
  postgres:
    image: postgres:16-alpine
    container_name: xora_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xora_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xora_password}
      POSTGRES_DB: ${POSTGRES_DB:-xora}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # DDL dijalankan otomatis saat volume masih kosong (fresh install).
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xora_user} -d ${POSTGRES_DB:-xora}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: xora_backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT:-5001}:5001"
    volumes:
      - ./backend:/app
      - /app/node_modules # Anonymous volume untuk mencegah override dari host
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # DATABASE_URL menunjuk ke hostname service `postgres` di dalam network Docker.
      - DATABASE_URL=postgresql://${POSTGRES_USER:-xora_user}:${POSTGRES_PASSWORD:-xora_password}@postgres:5432/${POSTGRES_DB:-xora}
      - DATABASE_SSL=false
      - PORT=5001
      - CLIENT_URL=http://localhost:${FRONTEND_PORT:-5173}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: xora_frontend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules # Anonymous volume untuk mencegah override dari host
    environment:
      - VITE_API_URL=http://localhost:${BACKEND_PORT:-5001}

volumes:
  postgres_data:
